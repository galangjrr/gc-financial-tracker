name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  ci:
    name: Code Quality & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Check if package.json exists before running npm ci to avoid pipeline break on empty repo
      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found. Skipping npm install."
          fi

      - name: Lint and Type Check
        run: |
          if [ -f package.json ]; then
            npm run lint --if-present
            npm run type-check --if-present
          else
            echo "Skipping lint and type check."
          fi

  deploy-database:
    name: Deploy Database Migrations
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy to Staging
        if: github.ref == 'refs/heads/staging'
        run: |
          if [ -n "${{ secrets.SUPABASE_STAGING_DB_URL }}" ] && [ -d supabase/migrations ]; then
            supabase db push --db-url "${{ secrets.SUPABASE_STAGING_DB_URL }}"
          else
            echo "Staging DB URL not configured or no migrations folder. Skipping."
          fi

      - name: Deploy to Production
        if: github.ref == 'refs/heads/main'
        run: |
          if [ -n "${{ secrets.SUPABASE_PRODUCTION_DB_URL }}" ] && [ -d supabase/migrations ]; then
            supabase db push --db-url "${{ secrets.SUPABASE_PRODUCTION_DB_URL }}"
          else
            echo "Production DB URL not configured or migrations already applied. Skipping."
          fi
